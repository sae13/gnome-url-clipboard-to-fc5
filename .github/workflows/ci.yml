name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GNOME packaging tools
        run: sudo apt-get update && sudo apt-get install --yes gnome-shell unzip

      - name: Run tests
        run: npm test

      - name: Verify JavaScript syntax
        run: npm run check

      - name: Build extension package
        run: npm run pack

      - name: Verify package contents
        run: |
          unzip -t url-shortener@fc5.ir.shell-extension.zip
          unzip -l url-shortener@fc5.ir.shell-extension.zip

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: url-shortener-gnome-shell-extension
          path: url-shortener@fc5.ir.shell-extension.zip
          if-no-files-found: error
