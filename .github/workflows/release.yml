name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GNOME packaging tools
        run: sudo apt-get update && sudo apt-get install --yes gnome-shell unzip

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "v$package_version" != "$RELEASE_TAG" ]; then
            printf 'package.json version %s does not match tag %s\n' "$package_version" "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Test and package
        run: |
          npm test
          npm run check
          npm run pack
          unzip -t url-shortener@fc5.ir.shell-extension.zip

      - name: Create checksum
        run: sha256sum url-shortener@fc5.ir.shell-extension.zip > url-shortener@fc5.ir.shell-extension.zip.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            url-shortener@fc5.ir.shell-extension.zip
            url-shortener@fc5.ir.shell-extension.zip.sha256
